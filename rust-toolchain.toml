# The toolchain CI uses (rustup picks it up in this folder). The oldest supported Rust is
# `rust-version` in Cargo.toml.
[toolchain]
channel = "1.100.0"
components = ["clippy", "llvm-tools", "rustfmt"]
# The npm package's target, so `npm run bench` and tools/build-npm.sh have it without a step of their own.
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
