# cargo-deny (tools/lint.sh): security advisories, licenses tsdocrs's MIT crate and npm package can
# ship, and crates only from crates.io.

[advisories]
# Unmaintained crates only fail when tsdocrs depends on them directly; a transitive one is its
# dependent's to replace.
unmaintained = "workspace"

[licenses]
# Permissive licenses only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
