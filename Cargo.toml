[package]
name = "tsdocrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A TSDoc parser: a port of @microsoft/tsdoc that gives the same tree and messages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cutenode/tsdocrs"
keywords = ["tsdoc", "typescript", "documentation", "parser", "jsdoc"]
categories = ["parser-implementations", "development-tools"]
exclude = [
    "/npm",
    "/fuzz",
    "/tools",
    "/tests/upstream",
    "/package.json",
    "/package-lock.json",
    "/.npmrc",
    "/bench",
    "/benches",
]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
cargo_common_metadata = "warn"

# cargo-shear (tools/lint.sh). automod declares these modules, so no `mod` line names them.
[package.metadata.cargo-shear]
ignored-paths = ["tests/props/*.rs", "tests/upstream/ports/*.rs"]

[dependencies]
dunce = { version = "1.0.5", optional = true }
indexmap = { version = "2.14.2", features = ["serde"] }
json-strip-comments = { version = "3.1.2", optional = true }
oxc_resolver = { version = "11.23.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
automod = "1.0.17"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hegeltest = { version = "=0.52.0", features = ["static-engine"] }
inventory = "0.3.25"
libtest-mimic = "0.8.2"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"

[features]
default = ["config-file"]
# tsdoc.json loading, which reads files and resolves `extends` the way Node does.
config-file = ["dep:dunce", "dep:json-strip-comments", "dep:oxc_resolver", "dep:serde_json"]

# TSDoc's own test suite, vendored in tests/upstream/ (tools/upstream/vendor.sh), run against this
# crate. libtest-mimic makes each upstream test a test of its own.
[[test]]
name = "upstream"
path = "tests/upstream/main.rs"
harness = false

# The Hegel properties, one file per area in tests/props/. tools/coverage.sh holds their own
# coverage to the suite's thresholds.
[[test]]
name = "props"
path = "tests/props/main.rs"

# tsdocrs against @microsoft/tsdoc on bench/corpus/: `npm run bench` runs this and the Node side
# (tools/bench/) and writes one report.
[[bench]]
name = "parse"
harness = false
