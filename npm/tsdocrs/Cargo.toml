[package]
name = "tsdocrs-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "The tsdocrs npm package: tsdocrs compiled to WebAssembly with wasm-bindgen"
license = "MIT"

[lib]
crate-type = ["cdylib"]

# Its own workspace, built for wasm32-unknown-unknown by tools/build-npm.sh.
[workspace]

[dependencies]
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
tsdocrs = { version = "0.1.1", path = "../..", default-features = false }
wasm-bindgen = "=0.2.130"

[profile.release]
# Speed over size: at "s", parse took a fifth longer for a wasm a sixth smaller.
opt-level = 3
lto = true
codegen-units = 1
