name: Scheduled

# Checks whose results change without a commit here, or that take too long for every pull request,
# weekly and on demand. A weekly run with a failed job opens an issue (scheduled-issue.yml).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # New advisories for Cargo.lock and package-lock.json, and zizmor's online audits (impostor
  # commits, known-vulnerable actions), which pull requests leave out.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,zizmor@1.31.1
      - run: cargo deny --locked check advisories
      - run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}
      # package.json's devEngines wants a newer npm than the runners' own Node has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm audit

  # The Hegel properties with random cases, each run several times. Pull requests run them
  # derandomized, drawing the same cases every time. A failure's examples are in the hegel artifact,
  # and copying them to .hegel/ replays them first in the next local run.
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --locked --test props --no-fail-fast --stress-count 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: hegel-props
          path: .hegel/
          include-hidden-files: true
          if-no-files-found: ignore

  # The differential tests against @microsoft/tsdoc with random cases, several times over, as props
  # does. Their failing examples are in the hegel-differential artifact.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --locked --test differential --no-fail-fast --stress-count 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: hegel-differential
          path: .hegel/
          include-hidden-files: true
          if-no-files-found: ignore

  # Each cargo-fuzz target in fuzz/ for five minutes, from an empty corpus. The differential target
  # runs @microsoft/tsdoc too, so it needs Node and `npm ci`. A crash's input is in the
  # fuzz-<target> artifact, and `cargo +nightly fuzz run <target> <file>` replays it.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [tokenizer, parser, differential]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      # cargo-fuzz builds with sanitizers, which take nightly. install-action doesn't carry
      # cargo-fuzz, so cargo installs it from crates.io with its own lockfile. Dependabot doesn't
      # bump this version.
      - run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2
      # It starts from the corpus's comments (fuzz/seeds/parser), and writes what it finds to
      # fuzz/corpus.
      - run: cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" fuzz/seeds/parser -- -max_total_time=300
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Every link in the Markdown (lychee.toml), which pull requests check offline: files and anchors
  # only.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress .
          output: ${{ runner.temp }}/lychee.md

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it.
  report:
    needs: [audit, props, differential, fuzz, links]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      details: >-
        A failed Hegel property's examples are in the run's hegel-props or hegel-differential
        artifact; copying them to .hegel/ replays them first in the next local run. A fuzz crash's
        input is in its fuzz-<target> artifact, and `cargo +nightly fuzz run <target> <file>`
        replays it.
