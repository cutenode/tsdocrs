name: Benchmarks

# tsdocrs against @microsoft/tsdoc (`npm run bench`), nightly and on demand: too slow for every
# pull request, and a shared runner's timings are noisy enough that the trend across nights says
# more than one run. The report is the job summary and the bench-report artifact. It also says how
# tsdocrs does on TSDoc's own tests at microsoft/tsdoc's default branch as it is that night.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      # The toolchain and its wasm32-unknown-unknown target, from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # The wasm-bindgen CLI npm/tsdocrs pins, prebuilt; `npm run bench` would build it otherwise.
      - id: wasm-bindgen
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' npm/tsdocrs/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error file=npm/tsdocrs/Cargo.toml::no exact wasm-bindgen pin"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # --live vendors TSDoc's suite at microsoft/tsdoc's default branch into target/upstream
      # (tools/upstream/vendor.sh, which runs upstream's Jest suite and the npm packages it installs:
      # this job has no secrets and a read-only token) and runs the harness on it.
      - run: npm run bench -- --live
      # The report, and a warning on the run when TSDoc's tests fail or didn't run. They don't fail
      # the job: until upstream.yml's pull request brings the new suite in and tsdocrs catches up,
      # every night would be red. The summary lists each failing test.
      - if: ${{ !cancelled() && hashFiles('target/bench/report.md') != '' }}
        run: |
          cat target/bench/report.md >> "$GITHUB_STEP_SUMMARY"
          jq -r '.accuracy as $a | ($a.error // ($a.failures | length | select(. > 0) |
            "\(.) upstream tests fail at microsoft/tsdoc@\($a.commit[:7]), listed in the job summary")) //
            empty | "::warning title=Accuracy::\(.)"' target/bench/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-report
          path: target/bench/report.*
          if-no-files-found: error
